module_b:
  skill_graph_version: "module-b-skillgraph-0.1.0"
  analysis_mode: "demo"
  default_population_demand_ratio: 0.2
  default_max_walk_time_min: 15
  numeric_tolerance: 0.000001
  max_budget_options: 64
  max_sensitivity_points: 20
  max_compare_scenarios: 12
  max_workers: 2
  run_output_dir: "outputs/module_b/runs"
  benchmark_output_dir: "outputs/module_b/bench"
  # Default remains Shiqi for requests without an explicit region/version.
  region_id: "shiqi"
  source_config: "configs/module_a_v2_b/shiqi.yaml"
  # Explicit v2 source allowlist. Requests must match both region_id and
  # data_version from the selected adapter; API callers cannot provide paths.
  region_source_configs:
    shiqi: "configs/module_a_v2_b/shiqi.yaml"
    east_district: "configs/module_a_v2_b/east_district.yaml"
    xiaolan: "configs/module_a_v2_b/xiaolan.yaml"
