# B-only experiment assumptions. These are not A data or engineering estimates.
experiment:
  label: HYPOTHETICAL
  data_source: configs/pilot.yaml
  expansion:
    candidate_site_count: 8
    action: hypothetical_capacity_increase
    capacity_delta_fraction: 0.25
    cost_units_per_site: 1.0
    budget_units: [0, 1, 3, 6]
    combination_policy: standalone
    source_status: HYPOTHETICAL
    human_confirmed: false
    note: >-
      Adds 25 percent of the registered capacity at a selected site. Cost is an
      abstract comparison unit, not a currency value, quote, or project estimate.
  base_scenario:
    population_demand_ratio: 0.2
    max_walk_time_min: 15
  sensitivity:
    population_demand_ratio: [0.1, 0.2, 0.3, 0.4]
    max_walk_time_min: [10, 15, 20]
